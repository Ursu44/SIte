<section #sectionRef class="max-w-7xl mx-auto px-4 py-16">

  <h2 class="text-3xl md:text-4xl font-bold text-slate-900 mb-10 text-center">
    Noutăți
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    @for (item of news; track item.title; let i = $index) {
      <div
        class="bg-white rounded-lg shadow-md overflow-hidden news-card"
        [class.news-card-visible]="isVisible()"
        [style.transition-delay]="(i * 0.2) + 's'"
      >
        <img [src]="item.image" [alt]="item.title" class="w-full h-48 object-cover" />
        <div class="p-5">
          <span class="text-sm text-amber-600 font-medium">{{ item.date }}</span>
          <h3 class="text-xl font-semibold text-slate-900 mt-1 mb-2">{{ item.title }}</h3>
          <p class="text-slate-600">{{ item.excerpt }}</p>
        </div>
      </div>
    }
  </div>

</section>
