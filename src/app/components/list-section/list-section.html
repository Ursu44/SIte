<div
  #sectionRef
  class="max-w-7xl mx-auto px-4 py-16"
  [style.opacity]="opacity()"
  [style.transform]="'translateX(' + (-60 * (1 - opacity())) + 'px)'"
  style="transition: opacity 0.8s ease-out, transform 0.8s ease-out;"
>
  <div class="text-center mb-12">
    <h2 class="text-3xl md:text-5xl font-bold text-slate-900 mt-2 mb-4">
      Noutăți
    </h2>
    <div class="w-16 h-1 bg-amber-500 mx-auto rounded-full"></div>
  </div>

  <div class="flex flex-col gap-6 max-w-3xl mx-auto">
    @for (item of newsItems; track item.title) {
      <div class="group relative bg-white/75 backdrop-blur-md rounded-xl p-6 border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-shadow duration-300 overflow-hidden">
        <div class="absolute left-0 top-0 h-full w-1 bg-amber-500 group-hover:w-2 transition-all duration-300"></div>
        <div class="pl-2">
          <span class="text-sm text-amber-600 font-medium">{{ item.date }}</span>
          <h3 class="text-xl font-semibold text-slate-900 mt-2 mb-2 group-hover:text-amber-600 transition-colors duration-300">
            {{ item.title }}
          </h3>
          <p class="text-slate-600 leading-relaxed">{{ item.description }}</p>
        </div>
      </div>
    }
  </div>

  <div class="text-center">
    <a href="/noutati" class="btn-wow group relative inline-flex items-center gap-2 mt-12 px-8 py-4 font-semibold rounded-full overflow-hidden">
      <span class="relative z-10 flex items-center gap-2 text-white">
        Vezi toate noutățile
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-300 group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </span>
    </a>
  </div>
</div>
