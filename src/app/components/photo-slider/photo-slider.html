<div #heroRef class="relative w-full h-[819px] overflow-hidden">

  @for (slide of slides; track slide.image; let i = $index) {
    <div
      class="absolute inset-0 transition-opacity duration-1000"
      [class.opacity-100]="currentIndex() === i"
      [class.opacity-0]="currentIndex() !== i"
      [class.pointer-events-none]="currentIndex() !== i"
    >
      <div
        class="w-full h-full bg-cover bg-center"
        [class.animate-kenburns]="currentIndex() === i"
        [style.background-image]="'url(' + slide.image + ')'"
      ></div>

      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/30 to-slate-950/10"></div>

      <div class="absolute inset-0 flex flex-col justify-center items-start px-8 md:px-20 text-white max-w-3xl">
        <h1
          class="text-3xl md:text-5xl font-bold mb-4 drop-shadow-lg"
          [class.animate-slide-in-left]="currentIndex() === i"
          style="opacity: 0;"
        >
          {{ slide.title }}
        </h1>

        <p
          class="text-lg md:text-xl text-slate-200 drop-shadow-md"
          [class.animate-slide-in-right]="currentIndex() === i"
          style="opacity: 0; animation-delay: 0.3s;"
        >
          {{ slide.subtitle }}
        </p>

        <button
          class="mt-6 px-6 py-3 bg-amber-500 text-slate-900 font-semibold rounded-md hover:bg-amber-400 transition-all duration-700 relative glow-permanent"
          [class.opacity-100]="currentIndex() === i"
          [class.opacity-0]="currentIndex() !== i"
          [class.translate-y-0]="currentIndex() === i"
          [class.translate-y-3]="currentIndex() !== i"
        >
          Află mai multe
        </button>
      </div>
    </div>
  }

  <button
    (click)="prev()"
    class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/10 hover:bg-white/20 text-white p-2 rounded-full transition-colors z-10"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
    </svg>
  </button>
  <button
    (click)="next()"
    class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/10 hover:bg-white/20 text-white p-2 rounded-full transition-colors z-10"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
    </svg>
  </button>

  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-2 z-10">
    @for (slide of slides; track slide.image; let i = $index) {
      <button
        (click)="goTo(i)"
        class="w-2.5 h-2.5 rounded-full transition-all"
        [class.bg-amber-500]="currentIndex() === i"
        [class.w-8]="currentIndex() === i"
        [class.bg-white_50]="currentIndex() !== i"
      ></button>
    }
  </div>

</div>
